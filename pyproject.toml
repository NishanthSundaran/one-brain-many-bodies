[project]
name = "one-brain-many-bodies"
version = "0.1.0"
description = "One brain for every humanoid: a local-VLM agent driving multiple humanoid bodies through a shared compliant control stack in MuJoCo."
authors = [{ name = "Nishanth Sundaran", email = "sundharnishanth@gmail.com" }]
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mujoco>=3.2",
    "numpy>=1.26,<2",
    "scipy>=1.8",
    "imageio[ffmpeg]",
    "pyyaml",
]

[project.optional-dependencies]
brain = ["openai"]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
